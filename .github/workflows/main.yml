name: Generate Wayland Protocols

on:
  push:
    paths:
      - "protocols/*.xml"
      - ".github/workflows/generate-wayland-protocol.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install wayland-scanner
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            wayland-protocols

      - name: Create output directory
        run: mkdir -p src/protocol

      - name: Generate all protocols
        shell: bash
        run: |
          shopt -s nullglob

          for xml in protocols/*.xml; do
              name=$(basename "$xml" .xml)

              echo "Generating $name"

              wayland-scanner client-header \
                  "$xml" \
                  "src/protocol/${name}-client-protocol.h"

              wayland-scanner server-header \
                  "$xml" \
                  "src/protocol/${name}-server-protocol.h"

              wayland-scanner private-code \
                  "$xml" \
                  "src/protocol/${name}-protocol.c"
          done

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/protocol

          if git diff --cached --quiet; then
              echo "No generated changes."
              exit 0
          fi

          git commit -m "Auto-generate Wayland protocols"
          git push origin HEAD:${{ github.ref_name }}
